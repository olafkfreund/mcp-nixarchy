name: Release Please

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release-please-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  release_please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - name: Create or publish release
        id: release
        uses: googleapis/release-please-action@v5
        with:
          # Nothing publishes from release events any more, so GITHUB_TOKEN is enough. A RELEASE_PLEASE_TOKEN
          # secret, if set, is still preferred: PRs opened with it also trigger CI.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}
